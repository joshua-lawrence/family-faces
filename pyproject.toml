[project]
name = "family-faces"
version = "0.1.0"
description = "Find, name and organize the people in your family photos, and link them to a family tree. Runs on your own computer."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "hdbscan>=0.8.44",
    "imageio-ffmpeg>=0.6.0",
    "insightface>=2.1",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.0",
    "safetensors>=0.5",
    "scipy>=1.14",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "umap-learn>=0.5.12",
]
